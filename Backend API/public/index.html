<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>IDLIX Web Player - Nonton Film & Serial TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14161d;
      --card-hover: #1c202a;
      --primary: #e50914;
      --primary-hover: #f40612;
      --accent: #38bdf8;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --border: #232733;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 12, 16, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      background: linear-gradient(135deg, #e50914, #ff4757);
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 6px 14px;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 4px 14px rgba(229, 9, 20, 0.4);
    }

    .brand-tag {
      font-size: 0.8rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #14161f;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      color: #fff;
      background: #202430;
    }

    .nav-btn.active {
      color: #fff;
      background: var(--primary);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 360px;
      min-width: 220px;
    }

    .search-box input {
      width: 100%;
      background: #14161f;
      border: 1px solid var(--border);
      color: white;
      padding: 10px 16px 10px 40px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
    }

    /* Container */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* Hero Banner */
    .hero {
      position: relative;
      height: 380px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 32px;
      display: flex;
      align-items: flex-end;
      padding: 32px;
      background-size: cover;
      background-position: center top;
      border: 1px solid var(--border);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11, 12, 16, 0.2) 0%, rgba(11, 12, 16, 0.95) 90%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
    }

    .hero-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .badge-quality {
      background: #f59e0b;
      color: #000;
    }

    .badge-rating {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #fff;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .hero-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-play {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 26px;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(229, 9, 20, 0.5);
    }

    .btn-play:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Grid Section */
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #3b4252;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
    }

    .poster-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #181a24;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover .poster-wrap img {
      transform: scale(1.05);
    }

    .card-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .card-info {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px 0 40px;
    }

    .pagination button {
      background: #141620;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: var(--primary);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Modal Player */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .player-container {
      background: #101218;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 1100px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      max-height: 92vh;
    }

    .player-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #161822;
    }

    .player-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-close {
      background: #252836;
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .btn-close:hover {
      background: var(--primary);
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .player-loading {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 16, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(229, 9, 20, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-episodes {
      padding: 16px 20px;
      background: #12141c;
      border-top: 1px solid var(--border);
      overflow-y: auto;
      max-height: 160px;
      display: none;
    }

    .episodes-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .episodes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ep-btn {
      background: #1c1f2b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ep-btn:hover {
      background: #2a3040;
    }

    .ep-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .player-footer {
      padding: 12px 20px;
      background: #141620;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .btn-secondary {
      background: #202432;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      background: #2d3345;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 12px 16px;
      }
      .hero {
        height: 280px;
        padding: 20px;
      }
      .hero-title {
        font-size: 1.5rem;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <a href="/" class="brand">
      <div class="brand-logo">IDLIX</div>
      <span class="brand-tag">WEB PLAYER</span>
    </a>

    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-movies" onclick="switchCategory('movies')">Film Populer</button>
      <button class="nav-btn" id="tab-series" onclick="switchCategory('series')">Serial TV</button>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Cari film, serial, anime..." onkeydown="handleSearch(event)">
    </div>
  </header>

  <main>
    <!-- Hero Spotlight Section -->
    <section class="hero" id="heroBanner" style="display: none;">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-badges">
          <span class="badge badge-quality" id="heroQuality">HD</span>
          <span class="badge badge-rating" id="heroRating">⭐ 8.5</span>
        </div>
        <h1 class="hero-title" id="heroTitle">Memuat Film Unggulan...</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <button class="btn-play" id="heroPlayBtn">
          ▶ Putar Sekarang
        </button>
      </div>
    </section>

    <!-- Main Grid Section -->
    <div class="section-title">
      <span id="sectionHeading">Film Populer Terbaru</span>
      <span id="itemCount" style="font-size: 0.85rem; color: var(--text-muted); font-weight: normal;"></span>
    </div>

    <div class="grid" id="contentGrid">
      <!-- Cards rendered here -->
    </div>

    <!-- Pagination -->
    <div class="pagination" id="paginationWrap">
      <button id="prevBtn" onclick="changePage(-1)" disabled>← Halaman Sebelumnya</button>
      <span id="pageInfo" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">Halaman 1</span>
      <button id="nextBtn" onclick="changePage(1)">Halaman Berikutnya →</button>
    </div>
  </main>

  <!-- Video Streaming Modal -->
  <div class="modal-backdrop" id="playerModal">
    <div class="player-container">
      <div class="player-header">
        <div class="player-title">
          <span id="playerTitle">Memuat Video...</span>
        </div>
        <button class="btn-close" onclick="closePlayer()">✕</button>
      </div>

      <div class="video-viewport">
        <div class="player-loading" id="playerLoading">
          <div class="spinner"></div>
          <div id="loadingStatusText" style="font-weight: 600; font-size: 1rem;">Menghubungkan ke server stream...</div>
          <div style="font-size: 0.8rem; color: var(--text-muted); max-width: 400px;">
            Membuka gate token Cloudflare & menyiapkan HLS stream. Proses ini memakan waktu 10-15 detik saat pertama kali.
          </div>
        </div>
        <video id="videoElement" controls playsinline></video>
      </div>

      <div class="player-episodes" id="seriesEpisodesWrap">
        <div class="episodes-title" id="episodesTitle">Pilih Episode:</div>
        <div class="episodes-list" id="episodesList"></div>
      </div>

      <div class="player-footer">
        <div>
          <span>Status Player: </span>
          <span id="streamStatusBadge" style="color: #4ade80; font-weight: 600;">Siap Putar</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn-secondary" onclick="copyStreamUrl()">📋 Salin Link Stream (.m3u8)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentCategory = 'movies';
    let currentPage = 1;
    let totalPages = 1;
    let searchQuery = '';
    let hlsInstance = null;
    let currentStreamUrl = '';

    const TMDB_POSTER = 'https://image.tmdb.org/t/p/w500';
    const TMDB_BACKDROP = 'https://image.tmdb.org/t/p/original';

    function getPosterUrl(path) {
      if (!path) return 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400&q=80';
      if (path.startsWith('http')) return path;
      return TMDB_POSTER + path;
    }

    function getBackdropUrl(path) {
      if (!path) return '';
      if (path.startsWith('http')) return path;
      return TMDB_BACKDROP + path;
    }

    // Switch Category Tabs
    function switchCategory(category) {
      currentCategory = category;
      currentPage = 1;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      
      document.getElementById('tab-movies').classList.toggle('active', category === 'movies');
      document.getElementById('tab-series').classList.toggle('active', category === 'series');
      document.getElementById('sectionHeading').textContent = category === 'movies' ? 'Film Populer Terbaru' : 'Serial TV & Anime Terbaru';
      
      loadContent();
    }

    // Search Handler
    function handleSearch(event) {
      if (event.key === 'Enter') {
        const query = event.target.value.trim();
        if (query) {
          searchQuery = query;
          document.getElementById('sectionHeading').textContent = `Hasil Pencarian: "${query}"`;
          executeSearch(query);
        } else {
          switchCategory(currentCategory);
        }
      }
    }

    // Load Movies or Series
    async function loadContent() {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 0;"><div class="spinner" style="margin: 0 auto 16px;"></div>Memuat katalog film...</div>';

      try {
        const res = await fetch(`/api/${currentCategory}?page=${currentPage}&limit=24`);
        const json = await res.json();
        const items = json.data || [];
        totalPages = json.pagination?.totalPages || 1;

        renderGrid(items);
        updatePagination(json.pagination);

        // Update hero banner with first item
        if (currentPage === 1 && items.length > 0) {
          setupHero(items[0]);
        }
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 40px 0;">Gagal memuat katalog: ${err.message}</div>`;
      }
    }

    // Search Query
    async function executeSearch(query) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 0;"><div class="spinner" style="margin: 0 auto 16px;"></div>Mencari film...</div>';
      document.getElementById('heroBanner').style.display = 'none';
      document.getElementById('paginationWrap').style.display = 'none';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const json = await res.json();
        const items = json.results || json.data || [];
        renderGrid(items);
        document.getElementById('itemCount').textContent = `Ditemukan ${items.length} item`;
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 40px 0;">Gagal mencari: ${err.message}</div>`;
      }
    }

    // Render Grid Cards
    function renderGrid(items) {
      const grid = document.getElementById('contentGrid');
      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 0;">Tidak ada konten ditemukan.</div>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const title = item.title || item.name || 'Tanpa Judul';
        const year = (item.releaseDate || item.firstAirDate || '').split('-')[0] || '';
        const rating = item.voteAverage && parseFloat(item.voteAverage) > 0 ? parseFloat(item.voteAverage).toFixed(1) : '';
        const quality = item.quality || 'HD';
        const poster = getPosterUrl(item.posterPath);
        const type = item.contentType || (item.firstAirDate ? 'series' : 'movie');

        return `
          <div class="card" onclick="openPlayer('${type}', '${item.id}', '${encodeURIComponent(title)}', '${item.slug || ''}')">
            <div class="poster-wrap">
              <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400&q=80'">
              <div class="card-badges">
                <span class="badge badge-quality">${quality}</span>
                ${rating ? `<span class="badge badge-rating">⭐ ${rating}</span>` : ''}
              </div>
            </div>
            <div class="card-info">
              <div class="card-title" title="${title}">${title}</div>
              <div class="card-meta">
                <span>${year}</span>
                <span style="text-transform: capitalize;">${type === 'series' ? 'Serial TV' : 'Film'}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Setup Spotlight Hero
    function setupHero(item) {
      const hero = document.getElementById('heroBanner');
      const backdrop = getBackdropUrl(item.backdropPath || item.posterPath);
      if (!backdrop) return;

      hero.style.backgroundImage = `url('${backdrop}')`;
      document.getElementById('heroTitle').textContent = item.title;
      document.getElementById('heroDesc').textContent = item.overview || 'Tonton film ini dengan kualitas terbaik sekarang langsung di browser.';
      document.getElementById('heroRating').textContent = `⭐ ${parseFloat(item.voteAverage || 7.5).toFixed(1)}`;
      document.getElementById('heroQuality').textContent = item.quality || 'WEB-DL';

      const type = item.contentType || 'movie';
      document.getElementById('heroPlayBtn').onclick = () => {
        openPlayer(type, item.id, encodeURIComponent(item.title), item.slug);
      };

      hero.style.display = 'flex';
    }

    // Pagination
    function updatePagination(pagination) {
      if (!pagination) return;
      document.getElementById('paginationWrap').style.display = 'flex';
      document.getElementById('pageInfo').textContent = `Halaman ${currentPage} dari ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(delta) {
      currentPage += delta;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      loadContent();
    }

    // Open Video Player
    async function openPlayer(contentType, id, titleEncoded, slug) {
      const title = decodeURIComponent(titleEncoded);
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoElement');
      const loading = document.getElementById('playerLoading');
      const statusText = document.getElementById('loadingStatusText');
      const seriesWrap = document.getElementById('seriesEpisodesWrap');

      document.getElementById('playerTitle').textContent = title;
      modal.classList.add('open');
      loading.style.display = 'flex';
      statusText.textContent = 'Menghubungkan ke scraper & membuka token...';
      seriesWrap.style.display = 'none';

      // If it's a TV series, fetch episodes list first
      if (contentType === 'series' && slug) {
        try {
          statusText.textContent = 'Memuat daftar episode serial...';
          const seriesRes = await fetch(`/api/series/${slug}`);
          const seriesData = await seriesRes.json();
          const series = seriesData.data || seriesData;

          const episodes = series.defaultSeason?.episodes || series.seasons?.[0]?.episodes || [];
          if (episodes.length > 0) {
            renderEpisodes(episodes, series);
            // Play first episode
            playEpisodeStream(episodes[0].id, `${title} - Episode 1`);
            return;
          }
        } catch (e) {
          console.warn('Series fetch err:', e);
        }
      }

      // Play Movie or Single Item
      playEpisodeStream(id, title, contentType);
    }

    // Stream Video URL via HLS
    async function playEpisodeStream(contentId, streamTitle, contentType = 'movie') {
      const video = document.getElementById('videoElement');
      const loading = document.getElementById('playerLoading');
      const statusText = document.getElementById('loadingStatusText');

      loading.style.display = 'flex';
      statusText.textContent = 'Menyelesaikan countdown & verifikasi HLS playlist...';
      document.getElementById('playerTitle').textContent = streamTitle;

      try {
        const resolveUrl = `/api/playback/resolve?contentType=${contentType}&contentId=${contentId}&contentTitle=${encodeURIComponent(streamTitle)}`;
        const res = await fetch(resolveUrl);
        const data = await res.json();

        if (!data || !data.hlsMasterUrl) {
          throw new Error(data?.error || 'URL stream video tidak ditemukan.');
        }

        currentStreamUrl = data.hlsMasterUrl;
        statusText.textContent = 'Memuat video stream...';

        // Load HLS video
        if (Hls.isSupported()) {
          if (hlsInstance) {
            hlsInstance.destroy();
          }
          hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 90
          });
          hlsInstance.loadSource(data.hlsMasterUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            loading.style.display = 'none';
            video.play().catch(() => {});
          });
          hlsInstance.on(Hls.Events.ERROR, (event, err) => {
            if (err.fatal) {
              statusText.textContent = 'Gagal memuat video stream HLS.';
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Safari native HLS
          video.src = data.hlsMasterUrl;
          video.addEventListener('loadedmetadata', () => {
            loading.style.display = 'none';
            video.play().catch(() => {});
          });
        } else {
          statusText.textContent = 'Browser Anda tidak mendukung pemutaran HLS streaming.';
        }

        // Subtitles
        if (data.subtitles && Array.isArray(data.subtitles)) {
          // Remove old tracks
          while (video.firstChild) {
            video.removeChild(video.firstChild);
          }
          data.subtitles.forEach((sub, idx) => {
            const track = document.createElement('track');
            track.kind = 'subtitles';
            track.label = sub.label || sub.lang || `Subtitle ${idx + 1}`;
            track.srclang = sub.lang || 'id';
            track.src = sub.path;
            if (sub.lang === 'id' || sub.label?.toLowerCase().includes('indo') || idx === 0) {
              track.default = true;
            }
            video.appendChild(track);
          });
        }

      } catch (err) {
        statusText.innerHTML = `<span style="color:#ef4444;">Gagal memutar: ${err.message}</span><br><br><button class="btn-secondary" onclick="playEpisodeStream('${contentId}', '${streamTitle}', '${contentType}')">Coba Lagi</button>`;
      }
    }

    // Render Series Episode List
    function renderEpisodes(episodes, series) {
      const wrap = document.getElementById('seriesEpisodesWrap');
      const list = document.getElementById('episodesList');
      wrap.style.display = 'block';

      list.innerHTML = episodes.map((ep, idx) => {
        const epNum = ep.episodeNumber || (idx + 1);
        return `
          <button class="ep-btn ${idx === 0 ? 'active' : ''}" onclick="selectEpisode(this, '${ep.id}', '${series.title} - Episode ${epNum}')">
            Episode ${epNum}
          </button>
        `;
      }).join('');
    }

    function selectEpisode(btn, epId, epTitle) {
      document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playEpisodeStream(epId, epTitle, 'episode');
    }

    // Close Player
    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoElement');
      modal.classList.remove('open');
      video.pause();
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.src = '';
    }

    // Copy stream link
    function copyStreamUrl() {
      if (currentStreamUrl) {
        navigator.clipboard.writeText(currentStreamUrl);
        alert('Link streaming (.m3u8) berhasil disalin!');
      } else {
        alert('Belum ada video yang sedang diputar.');
      }
    }

    // Keyboard ESC to close
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePlayer();
    });

    // Initial Load
    loadContent();
  </script>
</body>
</html>
